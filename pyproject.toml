[project]
name = "consensus"
version = "0.1.0"
description = "Lab 03: proof of work, proof of stake (Casper FFG) and a gossip network, standard library only"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
